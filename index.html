<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Year in iOS — Developer Timeline</title>

<style>
  :root {
    --ink: #21252b;
    --sub: #5b6470;
    --teal: #0F6E56;
    --coral: #993C1D;
    --purple: #534AB7;
    --amber: #854F0B;
    --line: #f2924a;
  }

  * {
    box-sizing: border-box;
  }

  html {
    overflow-x: hidden;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #fff;
    color: var(--ink);
    padding: 20px 20px 60px;
    overflow-x: hidden;
  }

  .wrap {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
  }

  .kicker {
    display: inline-block;
    background: #2f8fd1;
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: .06em;
    padding: 6px 14px;
    border-radius: 4px;
    margin: 4px 0 6px;
  }

  h1 {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -.02em;
    margin: 0 0 4px;
  }

  @media (min-width: 768px) {
    h1 {
      font-size: 40px;
    }
  }

  .subtitle {
    font-size: 14px;
    color: var(--sub);
    margin: 0 0 16px;
    max-width: 700px;
    line-height: 1.45;
  }

  /* ---------------- FILTERS ---------------- */

  .filter-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }

  .filter-btn {
    border: 1px solid #d0d7de;
    background: #fff;
    color: var(--sub);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s ease;
  }

  .filter-btn:hover {
    background: #f3f4f6;
    color: var(--ink);
  }

  .filter-btn.active {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }

  /* ---------------- DESKTOP ROADMAP ---------------- */

  .stage {
    position: relative;
    width: 100%;
    max-width: 100%;
    display: none;
    overflow: visible;
  }

  @media (min-width: 768px) {
    .stage {
      display: block;
    }
  }

  .stage svg {
    display: block;
    width: 100%;
    max-width: 100%;
    height: auto;
    overflow: visible;
  }

  /* ---------------- LABELS ---------------- */

  .stop-label {
    position: absolute;
    cursor: pointer;
    z-index: 100;
    transition: opacity .3s ease, z-index 0s linear 0.4s;
  }

  .stop-label:hover,
  .stop-label.active {
    z-index: 10000;
    transition: opacity .3s ease, z-index 0s linear 0s;
  }

  .stop-badge {
    background: #fff;
    border: 1.5px solid var(--stop-color, #21252b);
    border-radius: 14px;
    padding: 6px 14px;
    font-size: var(--badge-font-size, 12.5px);
    font-weight: 700;
    white-space: nowrap;
    color: var(--stop-title-color, #21252b);
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
    transition: transform .15s ease, box-shadow .15s ease;
    text-align: center;
  }

  .stop-label.major-event .stop-badge {
    background: var(--stop-color, #21252b);
    color: #fff !important;
    border-width: 2px;
    box-shadow: 0 5px 18px rgba(0,0,0,.24);
  }

  .stop-label.major-event .stop-badge .badge-date {
    color: #fff !important;
    opacity: .9;
  }

  .stop-label.semi-major .stop-badge {
    border-width: 2px;
    box-shadow: 0 3px 12px rgba(0,0,0,.10);
  }

  .stop-badge .badge-date {
    display: block;
    font-size: var(--date-font-size, 10px);
    font-weight: 700;
    color: var(--stop-color, #21252b);
    margin-bottom: 1px;
  }

  .stop-badge .badge-title {
    display: block;
  }

  .stop-label:hover .stop-badge,
  .stop-label.active .stop-badge {
    transform: translateY(-2px);
    box-shadow: 0 7px 18px rgba(0,0,0,.14);
  }

  .stop-label.dim {
    opacity: .22;
    pointer-events: none;
  }

  /* ---------------- DETAIL POPUP ---------------- */

  .detail-panel {
    position: absolute;
    width: 280px;
    max-width: min(280px, calc(100vw - 32px));
    max-height: min(310px, 42vh);
    overflow-y: auto;
    background: #fff;
    border-radius: 12px;
    border: 1px solid #e6e4db;
    box-shadow: 0 12px 32px rgba(0,0,0,.14);
    padding: 14px 16px;
    z-index: 10001;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    margin: 0 !important;
    transition: opacity .25s ease 0.1s, visibility 0s linear 0.6s;
  }

  .stop-label:hover .detail-panel,
  .stop-label.active .detail-panel {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transition: opacity .2s ease 0s, visibility 0s linear 0s;
  }

  .detail-panel .date {
    font-size: 11px;
    font-weight: 700;
    margin: 0 0 4px;
    color: var(--stop-color, #21252b);
  }

  .detail-panel .title {
    font-size: 14px;
    font-weight: 700;
    margin: 0 0 6px;
    color: var(--stop-title-color, #21252b);
    line-height: 1.3;
  }

  .detail-panel .body {
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--sub);
    margin: 0;
  }

  .detail-link {
    display: inline-flex;
    align-items: center;
    margin-top: 10px;
    color: var(--stop-color, #0F6E56);
    font-size: 11.5px;
    font-weight: 700;
    text-decoration: none;
  }

  .detail-link:hover {
    text-decoration: underline;
  }

  .detail-panel .arrow {
    position: absolute;
    width: 12px;
    height: 12px;
    background: #fff;
  }

  /* ---------------- PINS ---------------- */

  .pin-halo {
    fill: none;
    stroke-width: 0;
    transition: stroke-width .2s ease, opacity .2s ease;
    opacity: 0;
  }

  .pin-group {
    transition: opacity .3s ease;
    cursor: pointer;
  }

  .pin-group.active .pin-halo {
    stroke-width: 10;
    opacity: .18;
  }

  .pin-group.dim {
    opacity: .22;
    pointer-events: none;
  }

  /* ---------------- MOBILE ---------------- */

  .mobile-timeline {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: 20px;
  }

  @media (min-width: 768px) {
    .mobile-timeline {
      display: none;
    }
  }

  .mobile-card {
    border-left: 4px solid var(--card-color);
    background: #f8fafc;
    border-radius: 0 8px 8px 0;
    padding: 14px 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,.05);
    transition: opacity .3s ease;
  }

  .mobile-card.semi-major {
    background: #fff;
    border-left-width: 5px;
    box-shadow: 0 2px 9px rgba(0,0,0,.07);
  }

  .mobile-card.major-event {
    background: #fff;
    border-left-width: 7px;
    box-shadow: 0 5px 15px rgba(0,0,0,.10);
  }

  .mobile-card .date {
    font-size: 11px;
    font-weight: 700;
    color: var(--card-color);
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .mobile-card .title {
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 6px;
    color: var(--ink);
  }

  .mobile-card .body {
    font-size: 13px;
    line-height: 1.5;
    color: var(--sub);
    margin: 0;
  }

  .mobile-card a {
    display: inline-block;
    margin-top: 8px;
    color: var(--card-color);
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
  }

  .mobile-card a:hover {
    text-decoration: underline;
  }

  /* ---------------- LEGEND ---------------- */

  .legend {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    font-size: 12.5px;
    color: var(--sub);
    margin-top: 24px;
  }

  .legend span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    display: inline-block;
  }

  /* ---------------- SMALL SCREENS ---------------- */

  @media (max-width: 767px) {
    body {
      padding: 16px 14px 40px;
    }

    .filter-bar {
      margin-bottom: 12px;
    }

    .filter-btn {
      font-size: 12px;
      padding: 6px 11px;
    }

    .subtitle {
      margin-bottom: 12px;
    }
  }
</style>
</head>

<body>

<div class="wrap">

  <span class="kicker">Sep 2025 – Sep 2026</span>

  <h1>The Year in iOS</h1>

  <p class="subtitle">
    The developer-focused year: 10 essential milestones covering SDK migrations, 
    App Store mandates, distribution shifts, and platform AI capabilities.
  </p>

  <div class="filter-bar">
    <button class="filter-btn active" onclick="filterCategory('all', this)">All Events</button>
    <button class="filter-btn" onclick="filterCategory('sdk', this)">SDK & Releases</button>
    <button class="filter-btn" onclick="filterCategory('deadline', this)">App Store Deadlines</button>
    <button class="filter-btn" onclick="filterCategory('regulatory', this)">Distribution</button>
    <button class="filter-btn" onclick="filterCategory('ai', this)">AI Platform</button>
  </div>

  <div class="stage" id="stage"></div>

  <div class="mobile-timeline" id="mobileTimeline"></div>

  <div class="legend">
    <span>
      <span class="dot" style="background:#0F6E56"></span>
      SDK / platform
    </span>
    <span>
      <span class="dot" style="background:#993C1D"></span>
      Distribution / regulation
    </span>
    <span>
      <span class="dot" style="background:#534AB7"></span>
      AI platform
    </span>
    <span>
      <span class="dot" style="background:#854F0B"></span>
      Deadline
    </span>
  </div>

</div>

<script>

/* All URLs verified and updated to functional canonical endpoints */
const milestones = [
  {
    date: "Sept 2025",
    title: "iOS 26 SDK released",
    body: "Liquid Glass design system ships across the OS. Xcode 26 arrives with an AI-assisted coding tool and Swift Testing improvements.",
    color: "teal",
    weight: 1.6,
    major: false,
    semiMajor: true,
    category: "sdk",
    link: "https://developer.apple.com/xcode/"
  },
  {
    date: "Nov 2025",
    title: "Alt. marketplaces expand",
    body: "DMA-style third-party app marketplace and web distribution rules extend to Japan and Brazil, beyond the EU.",
    color: "coral",
    weight: 1.2,
    major: false,
    semiMajor: false,
    category: "regulatory",
    link: "https://developer.apple.com/distribute/"
  },
  {
    date: "Jan 12, 2026",
    title: "Apple + Google Gemini deal",
    body: "Apple Foundation Models get rebuilt on Gemini, laying groundwork for far more capable Siri app-intent APIs later in 2026.",
    color: "purple",
    weight: 1.7,
    major: true,
    semiMajor: false,
    category: "ai",
    link: "https://developer.apple.com/news/"
  },
  {
    date: "Jan 31, 2026 · deadline",
    title: "Age-rating system takes effect",
    body: "Developers must answer updated age-rating questions in App Store Connect for every app to avoid submission interruptions.",
    color: "amber",
    weight: 1.0,
    major: false,
    semiMajor: false,
    category: "deadline",
    link: "https://developer.apple.com/news/upcoming-requirements/"
  },
  {
    date: "Feb 15, 2026 · deadline",
    title: "Privacy Manifest enforcement",
    body: "Strict validation for required reason APIs and third-party SDK signatures goes active. Missing manifests result in immediate app build rejection.",
    color: "amber",
    weight: 1.2,
    major: false,
    semiMajor: true,
    category: "deadline",
    link: "https://developer.apple.com/documentation/bundleresources/privacy-manifest-files"
  },
  {
    date: "Apr 28, 2026 · deadline",
    title: "iOS 26 SDK becomes mandatory",
    body: "Apps uploaded to App Store Connect must now be built with Xcode 26 and the iOS 26 or iPadOS 26 SDK.",
    color: "amber",
    weight: 1.3,
    major: false,
    semiMajor: true,
    category: "deadline",
    link: "https://developer.apple.com/news/upcoming-requirements/"
  },
  {
    date: "Jun 8–12, 2026 · WWDC",
    title: "iOS 27 SDK, Siri AI, Xcode 27",
    body: "New app-intent and on-screen context APIs, a SwiftUI Document API, and Xcode 27's SwiftUI-specialist coding tools. The biggest developer event of the window.",
    color: "teal",
    weight: 2.2,
    major: true,
    semiMajor: false,
    category: "sdk",
    link: "https://developer.apple.com/wwdc/"
  },
  {
    date: "Jul 8, 2026",
    title: "EU court upholds DMA rules",
    body: "The EU General Court confirms App Store and iOS distribution obligations stand, rejecting all three of Apple's challenges.",
    color: "coral",
    weight: 1.3,
    major: false,
    semiMajor: true,
    category: "regulatory",
    link: "https://developer.apple.com/support/apps-in-the-eu"
  },
  {
    date: "Aug 18, 2026",
    title: "EU developer terms updated",
    body: "New eligibility rules for running an alternative marketplace or web distribution in the EU, effective October 1.",
    color: "coral",
    weight: 1.1,
    major: false,
    semiMajor: false,
    category: "regulatory",
    link: "https://developer.apple.com/news/?id=0cgo95n6"
  },
  {
    date: "Mid-Sept 2026",
    title: "iOS 27 public release",
    body: "iOS 27 rolls out publicly to supported iPhones alongside the launch of the new hardware lineup.",
    color: "teal",
    weight: 1.6,
    major: true,
    semiMajor: false,
    category: "sdk",
    link: "https://developer.apple.com/news/"
  }
];

const COLORS = {
  teal: { stroke: "#0F6E56", title: "#085041" },
  coral: { stroke: "#993C1D", title: "#712B13" },
  purple: { stroke: "#534AB7", title: "#3C3489" },
  amber: { stroke: "#854F0B", title: "#633806" }
};

const mobileContainer = document.getElementById("mobileTimeline");

milestones.forEach((m) => {
  const c = COLORS[m.color];
  const card = document.createElement("div");

  card.className = "mobile-card" +
    (m.major ? " major-event" : "") +
    (m.semiMajor ? " semi-major" : "");

  card.style.setProperty("--card-color", c.stroke);

  card.innerHTML = `
    <div class="date">${m.date}</div>
    <div class="title">${m.title}</div>
    <div class="body">${m.body}</div>
    ${m.link ? `<a href="${m.link}" target="_blank" rel="noopener noreferrer">Read Apple documentation ↗</a>` : ""}
  `;

  mobileContainer.appendChild(card);
});

const W = 1100;
const n = milestones.length;
const perRow = 3;
const topPad = 60;
const bandH = 230;
const rows = Math.ceil(n / perRow);
const totalH = bandH * rows + 100 + topPad;
const pts = [];

for (let i = 0; i < n; i++) {
  const rowIdx = Math.floor(i / perRow);
  const posInRow = i % perRow;
  const forward = rowIdx % 2 === 0;
  const t = forward ? posInRow / (perRow - 1) : 1 - posInRow / (perRow - 1);
  const x = 100 + t * (W - 200);
  const yWiggle = posInRow % 2 === 0 ? 0 : -70;
  const y = topPad + 110 + rowIdx * bandH + yWiggle;

  pts.push({ x, y, posInRow });
}

function catmullRom2bezier(points) {
  let d = `M${points[0].x},${points[0].y} `;
  for (let i = 0; i < points.length - 1; i++) {
    const p0 = points[i === 0 ? 0 : i - 1];
    const p1 = points[i];
    const p2 = points[i + 1];
    const p3 = points[i + 2 < points.length ? i + 2 : i + 1];

    const c1x = p1.x + (p2.x - p0.x) / 6;
    const c1y = p1.y + (p2.y - p0.y) / 6;
    const c2x = p2.x - (p3.x - p1.x) / 6;
    const c2y = p2.y - (p3.y - p1.y) / 6;

    d += `C${c1x},${c1y} ${c2x},${c2y} ${p2.x},${p2.y} `;
  }
  return d;
}

const pathD = catmullRom2bezier(pts);
const stage = document.getElementById("stage");
const svgNS = "http://www.w3.org/2000/svg";
let svgParts = [];

svgParts.push(`
  <svg viewBox="0 0 ${W} ${totalH}" xmlns="${svgNS}" preserveAspectRatio="xMidYMid meet">
`);

svgParts.push(`
  <path d="${pathD}" fill="none" stroke="#dfeaf3" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,6)" />
  <path d="${pathD}" fill="none" stroke="#f2924a" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  <path d="${pathD}" fill="none" stroke="#fff" stroke-width="2.5" stroke-dasharray="10 10" stroke-linecap="round" />
`);

pts.forEach((p, i) => {
  const m = milestones[i];
  const c = COLORS[m.color];
  const scale = m.weight || 1;
  const pinW = 22 * scale;
  const pinH = 30 * scale;
  const holeR = 6.5 * scale;
  const halfW = pinW / 2;
  const tipY = p.y;
  const headCy = tipY - pinH + halfW;

  const pinPath = `
    M ${p.x} ${tipY}
    C ${p.x - halfW * .9} ${tipY - pinH * .55}, ${p.x - halfW} ${headCy + halfW * .5}, ${p.x - halfW} ${headCy}
    A ${halfW} ${halfW} 0 1 1 ${p.x + halfW} ${headCy}
    C ${p.x + halfW} ${headCy + halfW * .5}, ${p.x + halfW * .9} ${tipY - pinH * .55}, ${p.x} ${tipY}
    Z
  `;

  const haloR = 20 * scale;

  svgParts.push(`
    <g class="pin-group" id="pin-${i}" data-idx="${i}">
      <circle class="pin-halo" cx="${p.x}" cy="${headCy}" r="${haloR}" stroke="${c.stroke}" />
      <path d="${pinPath}" fill="${c.stroke}" stroke="#fff" stroke-width="${1.8 * Math.sqrt(scale)}" />
      <circle cx="${p.x}" cy="${headCy}" r="${holeR}" fill="#fff" />
    </g>
  `);
});

svgParts.push(`</svg>`);
stage.innerHTML = svgParts.join("");

let hoverTimeout = null;

function layoutLabels() {
  if (window.innerWidth < 768) return;

  const svgEl = stage.querySelector("svg");
  if (!svgEl) return;

  const rect = svgEl.getBoundingClientRect();
  if (rect.width === 0) {
    requestAnimationFrame(layoutLabels);
    return;
  }

  const scaleX = rect.width / W;
  const scaleY = rect.height / totalH;

  document.querySelectorAll(".stop-label").forEach(el => el.remove());

  pts.forEach((p, i) => {
    const m = milestones[i];
    const c = COLORS[m.color];
    const scale = m.weight || 1;
    const div = document.createElement("div");

    div.className = "stop-label" +
      (m.major ? " major-event" : "") +
      (m.semiMajor ? " semi-major" : "");

    div.id = `label-${i}`;
    div.style.setProperty("--stop-color", c.stroke);
    div.style.setProperty("--stop-title-color", c.title);
    div.style.setProperty("--badge-font-size", `${11 + (scale - 1) * 3.5}px`);
    div.style.setProperty("--date-font-size", `${9 + (scale - 1) * 2}px`);
    div.style.zIndex = m.major ? 10000 : 100;

    const px = p.x * scaleX;
    const py = p.y * scaleY;
    const safeX = Math.max(80, Math.min(rect.width - 80, px));

    div.style.left = `${safeX}px`;

    const labelBelow = p.posInRow === 1;

    if (labelBelow) {
      div.style.top = `${py + 14}px`;
      div.style.transform = "translate(-50%, 0)";
    } else {
      div.style.top = `${Math.max(12, py - 30 * scale * scaleY - 10)}px`;
      div.style.transform = "translate(-50%, -100%)";
    }

    const panelSide = labelBelow ? "below" : "above";
    const vPos = panelSide === "below" ? "top: calc(100% + 14px); bottom: auto;" : "bottom: calc(100% + 14px); top: auto;";

    const third = W / 3;
    let hPos, arrowH;

    if (p.x < third) {
      hPos = "left: 0; right: auto; transform: none;";
      arrowH = "left: 24px; transform: rotate(45deg);";
    } else if (p.x > third * 2) {
      hPos = "right: 0; left: auto; transform: none;";
      arrowH = "right: 24px; transform: rotate(45deg);";
    } else {
      hPos = "left: 50%; right: auto; transform: translateX(-50%);";
      arrowH = "left: 50%; transform: translateX(-50%) rotate(45deg);";
    }

    const arrowV = panelSide === "below"
      ? "top: -6px; border-left: 1px solid #e6e4db; border-top: 1px solid #e6e4db;"
      : "bottom: -6px; border-right: 1px solid #e6e4db; border-bottom: 1px solid #e6e4db;";

    div.innerHTML = `
      <div class="stop-badge">
        <span class="badge-date">${m.date}</span>
        <span class="badge-title">${m.title}</span>
      </div>
      <div class="detail-panel" style="${vPos} ${hPos}">
        <p class="date">${m.date}</p>
        <p class="title">${m.title}</p>
        <p class="body">${m.body}</p>
        ${m.link ? `<a class="detail-link" href="${m.link}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Read Apple documentation ↗</a>` : ""}
        <div class="arrow" style="${arrowV} ${arrowH}"></div>
      </div>
    `;

    div.addEventListener("mouseenter", () => {
      clearTimeout(hoverTimeout);
      setActive(i);
    });

    div.addEventListener("mouseleave", () => {
      hoverTimeout = setTimeout(() => {
        setActive(null);
      }, 350);
    });

    div.addEventListener("click", (e) => {
      e.stopPropagation();
      const isActive = div.classList.contains("active");
      setActive(isActive ? null : i);
    });

    stage.appendChild(div);
  });
}

function setActive(idx) {
  document.querySelectorAll(".pin-group").forEach(g => {
    const gi = parseInt(g.dataset.idx, 10);
    g.classList.toggle("active", idx !== null && gi === idx);
  });

  document.querySelectorAll(".stop-label").forEach((el, gi) => {
    el.classList.toggle("active", idx !== null && gi === idx);
  });
}

function filterCategory(categoryName, btn) {
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  if (btn) btn.classList.add("active");

  const isAll = categoryName === "all";
  const mobileCards = document.querySelectorAll(".mobile-card");

  milestones.forEach((m, idx) => {
    const pin = document.getElementById(`pin-${idx}`);
    const label = document.getElementById(`label-${idx}`);
    const mobileCard = mobileCards[idx];
    const matches = isAll || m.category === categoryName;

    if (pin) pin.classList.toggle("dim", !matches);
    if (label) label.classList.toggle("dim", !matches);
    if (mobileCard) {
      mobileCard.style.opacity = matches ? "1" : ".25";
      mobileCard.style.pointerEvents = matches ? "auto" : "none";
    }
  });
}

document.addEventListener("click", () => setActive(null));

pts.forEach((p, i) => {
  const group = document.getElementById(`pin-${i}`);
  if (!group) return;

  group.addEventListener("mouseenter", () => {
    clearTimeout(hoverTimeout);
    setActive(i);
  });

  group.addEventListener("mouseleave", () => {
    hoverTimeout = setTimeout(() => {
      setActive(null);
    }, 350);
  });

  group.addEventListener("click", (e) => {
    e.stopPropagation();
    const isActive = group.classList.contains("active");
    setActive(isActive ? null : i);
  });
});

layoutLabels();
window.addEventListener("resize", layoutLabels);

</script>
</body>
</html>
