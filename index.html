<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Year in iOS timeline</title>
<style>
  :root {
    --ink: #21252b;
    --sub: #5b6470;
    --teal: #0F6E56; --teal-bg: #E1F5EE;
    --coral: #993C1D; --coral-bg: #FAECE7;
    --purple: #534AB7; --purple-bg: #EEEDFE;
    --amber: #854F0B; --amber-bg: #FAEEDA;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    background: #ffffff;
    color: var(--ink);
    padding: 20px 20px 60px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .kicker {
    display: inline-block;
    background: #2f8fd1;
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.06em;
    padding: 6px 14px;
    border-radius: 4px;
    margin: 4px 0 6px;
  }
  h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.01em; margin: 0 0 4px; }
  @media (min-width: 768px) {
    h1 { font-size: 40px; }
  }
  .subtitle { font-size: 14px; color: var(--sub); margin: 0 0 20px; max-width: 640px; }
  
  /* Desktop Interactive Canvas */
  .stage { position: relative; width: 100%; display: none; }
  @media (min-width: 768px) {
    .stage { display: block; }
  }
  .stage svg { display: block; width: 100%; height: auto; overflow: visible; }

  .stop-label {
    position: absolute;
    cursor: pointer;
    z-index: 2;
  }
  .stop-badge {
    background: #ffffff;
    border: 1.5px solid var(--stop-color, #21252b);
    border-radius: 14px;
    padding: 6px 14px;
    font-size: var(--badge-font-size, 12.5px);
    font-weight: 700;
    white-space: nowrap;
    color: var(--stop-title-color, #21252b);
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    transition: transform .15s ease, box-shadow .15s ease;
    text-align: center;
  }
  .stop-badge .badge-date {
    display: block;
    font-size: var(--date-font-size, 10px);
    font-weight: 700;
    color: var(--stop-color, #21252b);
    margin-bottom: 1px;
  }
  .stop-badge .badge-title { display: block; }
  .stop-label:hover .stop-badge,
  .stop-label.active .stop-badge {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.12);
  }
  .stop-label.dim .stop-badge { opacity: 0.35; }

  .detail-panel {
    position: absolute;
    width: 250px;
    background: #ffffff;
    border-radius: 12px;
    border: 1px solid #e6e4db;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    padding: 14px 16px;
    z-index: 20;
    opacity: 0;
    visibility: hidden;
    transition: opacity .16s ease, transform .16s ease, visibility 0s linear .16s;
    pointer-events: none;
  }
  .stop-label:hover .detail-panel,
  .stop-label.active .detail-panel {
    opacity: 1;
    visibility: visible;
    transition: opacity .16s ease, transform .16s ease;
    pointer-events: auto;
  }
  .detail-panel .date { font-size: 11px; font-weight: 700; margin: 0 0 4px; color: var(--stop-color, #21252b); }
  .detail-panel .title { font-size: 14px; font-weight: 700; margin: 0 0 6px; color: var(--stop-title-color, #21252b); line-height: 1.3; }
  .detail-panel .body { font-size: 12.5px; line-height: 1.5; color: var(--sub); margin: 0; }
  .detail-panel .arrow {
    position: absolute;
    left: 50%;
    width: 12px; height: 12px;
    background: #ffffff;
  }

  .pin-halo { fill: none; stroke-width: 0; transition: stroke-width .2s ease, opacity .2s ease; opacity: 0; }
  .pin-group.active .pin-halo { stroke-width: 10; opacity: 0.18; }
  .pin-group.dim { opacity: 0.35; }
  .pin-group { transition: opacity .25s ease; cursor: pointer; }

  /* Mobile Vertical View (< 768px) */
  .mobile-timeline {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-top: 20px;
  }
  @media (min-width: 768px) {
    .mobile-timeline { display: none; }
  }
  .mobile-card {
    border-left: 4px solid var(--card-color);
    background: #f8fafc;
    border-radius: 0 8px 8px 0;
    padding: 14px 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }
  .mobile-card .date {
    font-size: 11px;
    font-weight: 700;
    color: var(--card-color);
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  .mobile-card .title {
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 6px;
    color: var(--ink);
  }
  .mobile-card .body {
    font-size: 13px;
    line-height: 1.5;
    color: var(--sub);
    margin: 0;
  }

  .legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12.5px; color: var(--sub); margin-top: 24px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>
<div class="wrap">
  <span class="kicker">SEP 2025 &ndash; AUG 2026</span>
  <h1>The Year in iOS</h1>
  <p class="subtitle">Major SDK releases, App Store Connect deadlines, and platform shifts. Tap or hover stops for full detail.</p>

  <!-- Desktop interactive S-Curve -->
  <div class="stage" id="stage"></div>

  <!-- Mobile linear stack -->
  <div class="mobile-timeline" id="mobileTimeline"></div>

  <div class="legend">
    <span><span class="dot" style="background:#0F6E56"></span>SDK / platform release</span>
    <span><span class="dot" style="background:#993C1D"></span>Regulatory / distribution</span>
    <span><span class="dot" style="background:#534AB7"></span>AI platform strategy</span>
    <span><span class="dot" style="background:#854F0B"></span>Deadline / enforcement</span>
  </div>
</div>

<script>
const milestones = [
  { date: "Sept 2025", title: "iOS 26 SDK released", body: "Liquid Glass design system ships across the OS. Xcode 26 arrives with an AI-assisted coding tool and Swift Testing improvements.", color: "teal", weight: 1.6 },
  { date: "Apr 24, 2025 \u00b7 deadline", title: "iOS 18 SDK becomes mandatory", body: "Builds using older SDKs are rejected by App Store Connect from this date on. Xcode 16 or later required.", color: "amber", weight: 1.1 },
  { date: "Nov 2025", title: "Alt. marketplaces expand", body: "DMA-style third-party app marketplace and web distribution rules extend to Japan and Brazil, beyond the EU.", color: "coral", weight: 1.2 },
  { date: "Jan 12, 2026", title: "Apple + Google Gemini deal", body: "Apple Foundation Models get rebuilt on Gemini, laying groundwork for far more capable Siri app-intent APIs later in 2026.", color: "purple", weight: 1.7 },
  { date: "Jan 31, 2026 \u00b7 deadline", title: "Age-rating system takes effect", body: "Developers must answer updated age-rating questions in App Store Connect for every app to avoid submission interruptions.", color: "amber", weight: 1.0 },
  { date: "Apr 28, 2026 \u00b7 deadline", title: "iOS 26 SDK becomes mandatory", body: "Apps uploaded to App Store Connect must now be built with Xcode 26 and the iOS 26 or iPadOS 26 SDK.", color: "amber", weight: 1.3 },
  { date: "Jun 8\u201312, 2026 \u00b7 WWDC", title: "iOS 27 SDK, Siri AI, Xcode 27", body: "New app-intent and on-screen context APIs, a SwiftUI Document API, and Xcode 27's SwiftUI-specialist coding tools. The biggest developer event of the window.", color: "teal", weight: 2.2 },
  { date: "Jul 8, 2026", title: "EU court upholds DMA rules", body: "The EU General Court confirms App Store and iOS distribution obligations stand, rejecting all three of Apple's challenges.", color: "coral", weight: 1.3 },
  { date: "Aug 18, 2026", title: "EU developer terms updated", body: "New eligibility rules for running an alternative marketplace or web distribution in the EU, effective October 1.", color: "coral", weight: 1.1 },
];

const COLORS = {
  teal:   { stroke: "#0F6E56", title: "#085041" },
  coral:  { stroke: "#993C1D", title: "#712B13" },
  purple: { stroke: "#534AB7", title: "#3C3489" },
  amber:  { stroke: "#854F0B", title: "#633806" },
};

// Render mobile cards
const mobileContainer = document.getElementById('mobileTimeline');
milestones.forEach(m => {
  const c = COLORS[m.color];
  const card = document.createElement('div');
  card.className = 'mobile-card';
  card.style.setProperty('--card-color', c.stroke);
  card.innerHTML = `
    <div class="date">${m.date}</div>
    <div class="title">${m.title}</div>
    <div class="body">${m.body}</div>
  `;
  mobileContainer.appendChild(card);
});

// Desktop Layout Engine
const W = 1100, n = milestones.length;
const perRow = 3;
const topPad = 60;
const bandH = 220;
const rows = Math.ceil(n / perRow);
const totalH = bandH * rows + 100 + topPad;
const pts = [];

for (let i = 0; i < n; i++) {
  const rowIdx = Math.floor(i / perRow);
  const posInRow = i % perRow;
  const forward = rowIdx % 2 === 0;
  const t = forward ? posInRow / (perRow - 1) : 1 - posInRow / (perRow - 1);
  const x = 100 + t * (W - 200);
  const yWiggle = (posInRow % 2 === 0) ? 0 : -70;
  const y = topPad + 110 + rowIdx * bandH + yWiggle;
  pts.push({ x, y, posInRow });
}

function catmullRom2bezier(pts) {
  let d = `M${pts[0].x},${pts[0].y} `;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i === 0 ? 0 : i - 1];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[i + 2 < pts.length ? i + 2 : i + 1];
    const c1x = p1.x + (p2.x - p0.x) / 6;
    const c1y = p1.y + (p2.y - p0.y) / 6;
    const c2x = p2.x - (p3.x - p1.x) / 6;
    const c2y = p2.y - (p3.y - p1.y) / 6;
    d += `C${c1x},${c1y} ${c2x},${c2y} ${p2.x},${p2.y} `;
  }
  return d;
}

const pathD = catmullRom2bezier(pts);
const stage = document.getElementById('stage');
const svgNS = "http://www.w3.org/2000/svg";
let svgParts = [];
svgParts.push(`<svg viewBox="0 0 ${W} ${totalH}" xmlns="${svgNS}">`);
svgParts.push(`<path d="${pathD}" fill="none" stroke="#dfeaf3" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,6)"/>`);
svgParts.push(`<path d="${pathD}" fill="none" stroke="#f2924a" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>`);
svgParts.push(`<path d="${pathD}" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="10 10" stroke-linecap="round"/>`);

pts.forEach((p, i) => {
  const m = milestones[i];
  const c = COLORS[m.color];
  const scale = m.weight || 1.0;
  const pinW = 22 * scale;
  const pinH = 30 * scale;
  const holeR = 6.5 * scale;
  
  const halfW = pinW / 2;
  const tipY = p.y;
  const headCy = tipY - pinH + halfW;

  const pinPath = `
    M ${p.x} ${tipY}
    C ${p.x - halfW * 0.9} ${tipY - pinH * 0.55}, ${p.x - halfW} ${headCy + halfW * 0.5}, ${p.x - halfW} ${headCy}
    A ${halfW} ${halfW} 0 1 1 ${p.x + halfW} ${headCy}
    C ${p.x + halfW} ${headCy + halfW * 0.5}, ${p.x + halfW * 0.9} ${tipY - pinH * 0.55}, ${p.x} ${tipY}
    Z
  `;
  const haloR = 20 * scale;
  const zIdx = Math.round(scale * 10);

  svgParts.push(`
    <g class="pin-group" id="pin-${i}" data-idx="${i}" style="z-index: ${zIdx}; position: relative;">
      <circle class="pin-halo" cx="${p.x}" cy="${headCy}" r="${haloR}" stroke="${c.stroke}"/>
      <path d="${pinPath}" fill="${c.stroke}" stroke="#ffffff" stroke-width="${1.8 * Math.sqrt(scale)}"/>
      <circle cx="${p.x}" cy="${headCy}" r="${holeR}" fill="#ffffff"/>
    </g>
  `);
});

svgParts.push(`</svg>`);
stage.innerHTML = svgParts.join('');

function layoutLabels() {
  if (window.innerWidth < 768) return;
  const svgEl = stage.querySelector('svg');
  const rect = svgEl.getBoundingClientRect();
  if (rect.width === 0) { requestAnimationFrame(layoutLabels); return; }
  const scaleX = rect.width / W;
  const scaleY = rect.height / totalH;

  document.querySelectorAll('.stop-label').forEach(el => el.remove());

  pts.forEach((p, i) => {
    const m = milestones[i];
    const c = COLORS[m.color];
    const scale = m.weight || 1.0;

    const div = document.createElement('div');
    div.className = 'stop-label';
    div.id = `label-${i}`;
    div.style.setProperty('--stop-color', c.stroke);
    div.style.setProperty('--stop-title-color', c.title);
    div.style.setProperty('--badge-font-size', `${11.5 + (scale - 1) * 3}px`);
    div.style.setProperty('--date-font-size', `${9.5 + (scale - 1) * 2}px`);
    div.style.zIndex = Math.round(scale * 10);

    const px = p.x * scaleX;
    const py = p.y * scaleY;
    const pinHeadTop = 30 * scale * scaleY;
    const labelBelow = p.posInRow === 1;

    div.style.left = `${px}px`;
    if (labelBelow) {
      div.style.top = `${py + 14}px`;
      div.style.transform = 'translate(-50%, 0)';
    } else {
      div.style.top = `${py - pinHeadTop - 10}px`;
      div.style.transform = 'translate(-50%, -100%)';
    }

    const panelSide = labelBelow ? 'below' : 'above';
    const vPos = panelSide === 'below'
      ? 'top: 100%; margin-top: 14px;'
      : 'bottom: 100%; margin-bottom: 14px;';

    const third = W / 3;
    let hPos, arrowH;
    if (p.x < third) {
      hPos = 'left: 0; transform: none;';
      arrowH = 'left: 24px; transform: rotate(45deg);';
    } else if (p.x > third * 2) {
      hPos = 'right: 0; transform: none;';
      arrowH = 'right: 24px; transform: rotate(45deg);';
    } else {
      hPos = 'left: 50%; transform: translateX(-50%);';
      arrowH = 'left: 50%; transform: translateX(-50%) rotate(45deg);';
    }

    const arrowV = panelSide === 'below'
      ? 'top: -6px; border-left: 1px solid #e6e4db; border-top: 1px solid #e6e4db;'
      : 'bottom: -6px; border-right: 1px solid #e6e4db; border-bottom: 1px solid #e6e4db;';

    div.innerHTML = `
      <div class="stop-badge">
        <span class="badge-date">${m.date}</span>
        <span class="badge-title">${m.title}</span>
      </div>
      <div class="detail-panel" style="${vPos} ${hPos}">
        <p class="date">${m.date}</p>
        <p class="title">${m.title}</p>
        <p class="body">${m.body}</p>
        <div class="arrow" style="${arrowV} ${arrowH}"></div>
      </div>
    `;

    // Support both mouse hover and touch/click toggles
    div.addEventListener('mouseenter', () => setActive(i));
    div.addEventListener('mouseleave', () => setActive(null));
    div.addEventListener('click', (e) => {
      e.stopPropagation();
      const isActive = div.classList.contains('active');
      setActive(isActive ? null : i);
    });

    stage.appendChild(div);
  });
}

function setActive(idx) {
  document.querySelectorAll('.pin-group').forEach(g => {
    const gi = parseInt(g.dataset.idx);
    g.classList.toggle('active', idx !== null && gi === idx);
    g.classList.toggle('dim', idx !== null && gi !== idx);
  });
  document.querySelectorAll('.stop-label').forEach((el, gi) => {
    el.classList.toggle('active', idx !== null && gi === idx);
    el.classList.toggle('dim', idx !== null && gi !== idx);
  });
}

// Clear active state when clicking empty background
document.addEventListener('click', () => setActive(null));

pts.forEach((p, i) => {
  const group = document.getElementById(`pin-${i}`);
  if (!group) return;
  group.addEventListener('mouseenter', () => setActive(i));
  group.addEventListener('mouseleave', () => setActive(null));
  group.addEventListener('click', (e) => {
    e.stopPropagation();
    const isActive = group.classList.contains('active');
    setActive(isActive ? null : i);
  });
});

layoutLabels();
window.addEventListener('resize', layoutLabels);
</script>
</body>
</html>
